<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bin Xiang 宾香 · Carta de tragos · Drinks · 酒水</title>
<meta name="description" content="Carta de tragos de Bin Xiang: copas, jarras, cervezas y Hora Dorada en Antonio Varas 67, Providencia. Español · English · Português · 中文.">
<meta name="theme-color" content="#1A1613">
<meta property="og:title" content="Bin Xiang 宾香 · Carta de tragos">
<meta property="og:description" content="Copas, jarras y cervezas · Antonio Varas 67, Providencia · ES / EN / PT / 中文">
<meta property="og:type" content="website">
<meta property="og:image" content="https://tianzote.github.io/binxiang-carta/jarra-sangria.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='31' fill='%238C1D2B'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23EFE7D8' font-family='serif' font-weight='700'%3E宾%3C/text%3E%3C/svg%3E">
<script>(function(){var t;try{t=localStorage.getItem("bx_theme")}catch(e){}document.documentElement.setAttribute("data-theme",t==="dark"||t==="light"?t:"dark")})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Serif:ital,wght@0,700;1,600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ---------- Tema claro / oscuro ---------- */
  :root{--red:#8C1D2B;--red-dark:#5E1420;--ink:#1A1613;--gold:#B8963E;--gold-light:#E2C98A;--head-h:104px;
    --bg:#F7F2E7;--card:#FFFDF8;--txt:#1A1613;--mut:#5d564c;--head:#8C1D2B;--price:#5E1420;--sub:#2F5548;
    --line:rgba(140,29,43,.22);--edge:#DCCDA8;--pill-t:#5E1420;--input:#fff;--chip:#F3ECDC;
    --h-bg:#FBEFC9;--h-b:#D9B45A;--h-t:#7a5a1c;--h-s:#5a3f10;
    --hero-a:#FFFDF8;--hero-b:#EFE4CC;--hero-t:#1A1613;--hero-mut:#5d564c;--hero-acc:#8C1D2B;--hero-edge:#CDB984}
  html[data-theme="dark"]{--bg:#14100e;--card:#211a16;--txt:#F3EBDD;--mut:#BBAE9F;--head:#E2C98A;--price:#E2C98A;--sub:#9FCDBB;
    --line:#3d3028;--edge:#3d3028;--pill-t:#F3EBDD;--input:#211a16;--chip:#2b211c;
    --h-bg:#33260c;--h-b:#7a5a1c;--h-t:#E8C877;--h-s:#FBE7B0;
    --hero-a:#5E1420;--hero-b:#1A1613;--hero-t:#EFE7D8;--hero-mut:rgba(239,231,216,.78);--hero-acc:#E2C98A;--hero-edge:rgba(226,201,138,.45)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink)}
  body{font-family:'Noto Sans','Noto Sans SC',-apple-system,'Segoe UI',Roboto,'PingFang SC',sans-serif;color:var(--txt);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  button{font-family:inherit}

  /* ---------- Encabezado (igual en comida y tragos) ---------- */
  .head{position:sticky;top:0;z-index:20}
  .topbar{background:var(--ink);color:#F3EBDD;padding:9px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:2px solid var(--gold)}
  .brand{font-family:'Noto Serif SC','Noto Serif',Georgia,serif;font-weight:700;font-size:18px;white-space:nowrap;color:#F3EBDD;text-decoration:none;background:none;border:none;cursor:pointer;padding:6px 0}
  .brand small{font-size:13px;color:var(--gold-light);font-weight:700;margin-left:4px}
  .lang-switch{display:flex;gap:6px}
  .lang-switch button,.theme-btn{width:36px;height:36px;border-radius:50%;border:1px solid rgba(226,201,138,.55);background:transparent;color:var(--gold-light);font-weight:700;font-size:12px;cursor:pointer;flex:none}
  .lang-switch button.current{background:#9E2233;border-color:var(--gold-light);color:#fff}
  .theme-btn{font-size:16px;line-height:1;margin-left:4px}
  @media (max-width:374px){.lang-switch{gap:4px}.lang-switch button,.theme-btn{width:32px;height:32px}.brand small{display:none}.topbar{padding:9px 10px}}
  .cat-nav{display:flex;gap:8px;overflow-x:auto;padding:9px 14px;background:var(--bg);border-bottom:1px solid var(--edge);scrollbar-width:none;box-shadow:0 4px 10px -6px rgba(0,0,0,.25)}
  .head::after{content:"";position:absolute;right:0;bottom:1px;width:30px;height:50px;background:linear-gradient(90deg,transparent,var(--bg));pointer-events:none}
  .cat-nav::-webkit-scrollbar{display:none}
  .cat-nav::after{content:"";flex:0 0 24px}
  .cat-pill{flex:0 0 auto;padding:8px 14px;border-radius:20px;background:var(--card);border:1px solid var(--edge);font-size:13px;font-weight:600;color:var(--pill-t);white-space:nowrap;cursor:pointer}
  .cat-pill.active{background:#9E2233;color:#fff;border-color:#9E2233}

  .contact{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
  .hours{font-size:12.5px;line-height:1.6;margin-top:6px}

  .ig{display:flex;align-items:center;gap:10px;text-decoration:none;border-radius:14px;padding:11px 14px;margin:12px 0 0;background:linear-gradient(100deg,#833ab4,#c13584 45%,#e1306c 70%,#f77737);color:#fff;font-weight:700;font-size:14px}
  .ig .ic{width:30px;height:30px;flex:none;border:2px solid #fff;border-radius:9px;position:relative}
  .ig .ic::before{content:"";position:absolute;inset:6px;border:2px solid #fff;border-radius:50%}
  .ig .ic::after{content:"";position:absolute;top:3px;right:3px;width:4px;height:4px;background:#fff;border-radius:50%}
  .ig small{display:block;font-weight:500;font-size:12px;opacity:.92}
  .ig .go{margin-left:auto;font-size:18px}

  /* ---------- Navegación inferior ---------- */
  .bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;z-index:30;display:flex;background:var(--ink);border-top:2px solid var(--gold);padding:7px 10px calc(7px + env(safe-area-inset-bottom));gap:8px}
  .bottom-nav a{flex:1;text-align:center;padding:11px 4px;border-radius:12px;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none;color:var(--gold-light);border:1px solid rgba(226,201,138,.3)}
  .bottom-nav a.on{background:#9E2233;color:#fff;border-color:#9E2233}
  .bottom-nav button{flex:0 0 42px;border-radius:12px;border:1px solid rgba(226,201,138,.3);background:transparent;color:var(--gold-light);font-size:18px;cursor:pointer}
  @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

  body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  .app{max-width:480px;margin:0 auto;position:relative;background:var(--bg);min-height:100vh;min-height:100svh;box-shadow:0 0 60px rgba(0,0,0,.5)}

  main{padding:0 14px}
  .hora{margin-top:14px;background:linear-gradient(100deg,#3b2a0c,#5a3f10);border:1px solid #7a5a1c;color:#F6DFA4;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
  .hora .ico{font-size:22px;line-height:1.1}
  .hora b{display:block;font-size:15px;color:#fff}
  .hora span{font-size:13px;line-height:1.4}

  section{scroll-margin-top:var(--head-h)}
  h2{font-family:'Noto Serif SC','Noto Serif',Georgia,serif;color:var(--head);font-size:21px;font-weight:900;margin:24px 2px 10px}
  h2 small{display:block;font-family:'Noto Sans SC',sans-serif;font-size:12.5px;color:var(--mut);font-weight:400;margin-top:1px}
  .item{background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:12px 14px;min-height:64px;margin-bottom:8px;display:flex;gap:12px;align-items:center}
  .thumb{flex:none;width:72px;height:72px;border-radius:10px;background:var(--chip);overflow:hidden;display:flex;align-items:center;justify-content:center;border:none;padding:0;cursor:zoom-in;position:relative}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb::after{content:"⤢";position:absolute;right:4px;bottom:1px;font-size:11px;color:#fff;text-shadow:0 0 3px #000}
  .body{flex:1;min-width:0}
  .row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .name{font-weight:700;font-size:15.5px;line-height:1.3;color:var(--txt)}
  .zh{color:var(--mut);font-size:12.5px;margin-top:1px}
  .desc{color:var(--mut);font-size:13px;margin-top:3px;line-height:1.4}
  .price{font-weight:700;font-size:16px;color:var(--price);white-space:nowrap}
  .prices{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .pr{font-size:12px;border-radius:9px;padding:5px 9px;background:var(--chip);border:1px solid var(--edge);color:var(--mut);display:flex;flex-direction:column;line-height:1.25;min-width:68px}
  .pr b{font-size:15px;color:var(--txt)}
  .pr.h{border-color:var(--h-b);background:var(--h-bg);color:var(--h-t)}
  .pr.h b{color:var(--h-s)}

  footer{text-align:center;margin-top:26px;padding:24px 14px 16px;border-top:1px solid var(--edge)}
  footer .contact a{color:var(--txt);text-decoration:none;border:1px solid var(--edge);border-radius:12px;padding:12px 8px;font-size:13.5px;font-weight:600;background:var(--card)}
  footer .addr{font-size:13px;color:var(--txt);line-height:1.6}
  footer .hours{color:var(--mut)}
  footer .note{font-size:11.5px;color:var(--mut);margin-top:8px;line-height:1.5}

  #lb{position:fixed;inset:0;background:rgba(0,0,0,.93);display:none;z-index:40;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
  #lb.on{display:flex}
  #lb .imgs{display:flex;gap:10px;overflow-x:auto;max-width:100%;scroll-snap-type:x mandatory}
  #lb img{max-height:66vh;max-width:86vw;border-radius:14px;scroll-snap-align:center;flex:none}
  #lb .cap{color:#fff;font-weight:700;font-size:17px;text-align:center}
  #lb .hint{color:#E2C98A;font-size:13px}
  #lb .x{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.5);color:#fff;font-size:20px;cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <div class="head" id="head">
    <div class="topbar">
      <a class="brand" href="index.html" aria-label="Inicio">Bin Xiang <small>宾香</small></a>
      <div class="lang-switch"><span id="langs" style="display:contents"></span><button class="theme-btn" id="themeBtn" onclick="toggleTheme()" aria-label="Claro / oscuro"></button></div>
    </div>
    <nav class="cat-nav" id="chips" aria-label="Categorías"></nav>
  </div>
  <main>
    <div class="hora" id="hora"></div>
    <div id="igTop"></div>
    <div id="menu"></div>
  </main>
  <footer id="foot"></footer>
</div>
<nav class="bottom-nav" aria-label="Carta">
  <a href="index.html?lang=es" id="tabFood"></a>
  <a href="#" class="on" id="tabDrinks" onclick="window.scrollTo({top:0,behavior:'smooth'});return false"></a>
  <button aria-label="Subir" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
</nav>
<div id="lb" role="dialog" aria-modal="true" onclick="closeLb()"><button class="x" aria-label="Cerrar">✕</button><div class="imgs" id="lbImgs"></div><div class="cap" id="lbCap"></div><div class="hint" id="lbHint"></div></div>

<script src="tragos-data.js"></script>
<script>
const UI={
  es:{food:"🥢 Comida",drinks:"🍹 Tragos",copa:"Copa",happy:"✨ 2 por",jarra:"Jarra 1,5 L",jarra1:"Jarra 1 L",botella:"Botella",map:"📍 Cómo llegar",res:"💬 Reservar",hours:"Lun a Sáb 12:00–22:00 · Dom y festivos 12:00–21:00",light:"Modo claro",dark:"Modo oscuro",foot:"Venta de alcohol solo a mayores de 18 años. Precios sujetos a cambio sin previo aviso. Imágenes referenciales."},
  en:{food:"🥢 Food",drinks:"🍹 Drinks",copa:"Glass",happy:"✨ 2 for",jarra:"Pitcher 1.5 L",jarra1:"Pitcher 1 L",botella:"Bottle",map:"📍 Directions",res:"💬 Book a table",hours:"Mon–Sat 12:00–22:00 · Sun & holidays 12:00–21:00",light:"Light mode",dark:"Dark mode",foot:"Alcohol sold to adults 18+ only. Prices subject to change without notice. Photos for reference only."},
  pt:{food:"🥢 Comida",drinks:"🍹 Drinks",copa:"Taça",happy:"✨ 2 por",jarra:"Jarra 1,5 L",jarra1:"Jarra 1 L",botella:"Garrafa",map:"📍 Como chegar",res:"💬 Reservar",hours:"Seg a Sáb 12:00–22:00 · Dom e feriados 12:00–21:00",light:"Modo claro",dark:"Modo escuro",foot:"Venda de álcool apenas para maiores de 18 anos. Preços sujeitos a alteração sem aviso prévio. Imagens ilustrativas."},
  zh:{food:"🥢 菜单",drinks:"🍹 酒水",copa:"单杯",happy:"✨ 两杯",jarra:"一壶 1.5升",jarra1:"一壶 1升",botella:"整瓶",map:"📍 导航到店",res:"💬 订位",hours:"周一至周六 12:00–22:00 · 周日及节假日 12:00–21:00",light:"浅色模式",dark:"深色模式",foot:"仅向18岁以上成人售酒。价格如有变动，恕不另行通知。图片仅供参考。"}
};
const LANGS=[["es","ES"],["en","EN"],["pt","PT"],["zh","中"]];
const $=id=>document.getElementById(id);
const IGTXT={es:"Síguenos en Instagram",en:"Follow us on Instagram",pt:"Siga-nos no Instagram",zh:"关注我们的 Instagram"};
function igBanner(l){return `<a class="ig" href="https://www.instagram.com/binxiang67/" target="_blank" rel="noopener"><span class="ic"></span><span>@binxiang67<small>${IGTXT[l]||IGTXT.es}</small></span><span class="go">›</span></a>`}
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let lang=(()=>{try{const q=new URLSearchParams(location.search).get("lang");if(q&&UI[q]){localStorage.setItem("bx_lang",q);return q}}catch(e){}try{const s=localStorage.getItem("bx_lang");if(s)return s}catch(e){}return (navigator.language||"es").slice(0,2).toLowerCase()})();
if(!UI[lang])lang="es";

/* Tema claro / oscuro (se comparte con index.html) */
function paintTheme(){
  const dark=document.documentElement.getAttribute("data-theme")==="dark",b=$("themeBtn"),u=UI[lang];
  b.textContent=dark?"☀️":"🌙";b.setAttribute("aria-label",dark?u.light:u.dark);b.title=dark?u.light:u.dark;
}
function toggleTheme(){
  const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("bx_theme",t)}catch(e){}paintTheme();
}

/* Solo se muestra foto cuando el producto tiene una real (foto:"archivo.jpg" en tragos-data.js) */
function thumb(it,ci,ii){
  return it.foto?`<button class="thumb" onclick="openLb(${ci},${ii})" aria-label="${esc(it.n[lang])}"><img src="${it.foto}" alt="" loading="lazy" onerror="this.parentNode.remove()"></button>`:"";
}
const LBHINT={es:"Toca para cerrar",en:"Tap to close",pt:"Toque para fechar",zh:"点击关闭"};
const LBMORE={es:"Desliza para ver la jarra →",en:"Swipe to see the pitcher →",pt:"Deslize para ver a jarra →",zh:"滑动查看整壶 →"};
function openLb(ci,ii){
  const it=window.TRAGOS.categorias[ci].items[ii]; if(!it.foto) return;
  const fs=[it.foto].concat(it.foto2?[it.foto2]:[]);
  $("lbImgs").innerHTML=fs.map(f=>`<img src="${f}" alt="">`).join("");
  $("lbCap").textContent=it.n[lang];
  $("lbHint").textContent=(fs.length>1?LBMORE[lang]+" · ":"")+LBHINT[lang];
  $("lb").classList.add("on");
}
function closeLb(){$("lb").classList.remove("on")}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeLb()});
$("lbImgs").addEventListener("click",e=>{ if($("lbImgs").children.length>1) e.stopPropagation(); });

function render(){
  const u=UI[lang], D=window.TRAGOS;
  document.documentElement.lang=lang==="zh"?"zh-Hans":lang;
  $("langs").innerHTML=LANGS.map(([k,l])=>`<button class="${k===lang?'current':''}" onclick="setLang('${k}')" aria-label="${k.toUpperCase()}" ${k===lang?'aria-current="true"':''}>${l}</button>`).join("");
  $("tabFood").textContent=u.food;
  $("tabFood").href="index.html?lang="+lang;
  $("tabDrinks").textContent=u.drinks;
  const hp=String(D.horaDorada[lang]||"").split(" · ");
  $("hora").innerHTML=`<div class="ico">✨</div><div><b>${esc(hp.slice(0,2).join(" · "))}</b><span>${esc(hp.slice(2).join(" · "))}</span></div>`;
  $("igTop").innerHTML=igBanner(lang);
  $("chips").innerHTML=D.categorias.map(c=>`<button class="cat-pill" data-cat="${c.id}">${esc(c.nombre[lang])}</button>`).join("");
  $("menu").innerHTML=D.categorias.map((c,ci)=>`
    <section id="${c.id}"><h2>${esc(c.nombre[lang])}${lang!=="zh"?`<small>${esc(c.nombre.zh)}</small>`:""}</h2>
    ${c.items.map((it,ii)=>{
      const multi=it.h||it.j||it.j1||it.b;
      const pr=[];
      if(multi){
        if(it.p)pr.push(`<span class="pr">${u.copa}<b>${it.p}</b></span>`);
        if(it.h)pr.push(`<span class="pr h">${u.happy}<b>${it.h}</b></span>`);
        if(it.b)pr.push(`<span class="pr">${u.botella}<b>${it.b}</b></span>`);
        if(it.j1)pr.push(`<span class="pr">${u.jarra1}<b>${it.j1}</b></span>`);
        if(it.j)pr.push(`<span class="pr">${u.jarra}<b>${it.j}</b></span>`);
      }
      return `<div class="item">${thumb(it,ci,ii)}<div class="body">
        <div class="row"><div>
          <div class="name">${it.badge?it.badge+" ":""}${esc(it.n[lang])}</div>
          ${lang!=="zh"&&it.n.zh&&it.n.zh!==it.n[lang]?`<div class="zh">${esc(it.n.zh)}</div>`:""}
        </div>${!multi&&it.p?`<div class="price">${it.p}</div>`:""}</div>
        ${it.d&&it.d[lang]?`<div class="desc">${esc(it.d[lang])}</div>`:""}
        ${pr.length?`<div class="prices">${pr.join("")}</div>`:""}</div></div>`}).join("")}
    </section>`).join("");
  $("foot").innerHTML=`<div class="contact">
      <a href="https://wa.me/56997764557?text=Hola%2C%20quiero%20reservar%20una%20mesa%20en%20Bin%20Xiang" target="_blank" rel="noopener">${u.res}</a>
      <a href="tel:+56997764557">📞 +56 9 9776 4557</a>
      <a href="https://www.instagram.com/binxiang67/" target="_blank" rel="noopener">📸 @binxiang67</a>
      <a href="https://www.google.com/maps/search/?api=1&query=Bin+Xiang+Antonio+Varas+67+Providencia" target="_blank" rel="noopener">${u.map}</a>
    </div><div class="addr">Antonio Varas 67, Providencia, Santiago · ☎ 22 823 0191</div><div class="hours">🕐 ${u.hours}</div><div class="note">${u.foot}</div>`;
  paintTheme(); measure(); lastSpy=""; spy();
}
function setLang(k){lang=k;try{localStorage.setItem("bx_lang",k)}catch(e){}render()}

/* Categorías: clic + resaltado automático al hacer scroll */
let spyLock=0,lastSpy="";
function measure(){document.documentElement.style.setProperty("--head-h",($("head").offsetHeight+6)+"px")}
function setActive(id){
  const nav=$("chips");let act=null;
  nav.querySelectorAll(".cat-pill").forEach(p=>{const on=p.dataset.cat===id;p.classList.toggle("active",on);if(on)act=p});
  if(act)nav.scrollTo({left:act.offsetLeft-(nav.clientWidth-act.offsetWidth)/2,behavior:"smooth"});
}
function spy(){
  if(Date.now()<spyLock)return;
  const secs=document.querySelectorAll("main section");if(!secs.length)return;
  const line=$("head").offsetHeight+24;let cur=secs[0];
  secs.forEach(s=>{if(s.getBoundingClientRect().top<=line)cur=s});
  if(window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-4)cur=secs[secs.length-1];
  if(cur.id!==lastSpy){lastSpy=cur.id;setActive(cur.id)}
}
$("chips").addEventListener("click",e=>{
  const p=e.target.closest(".cat-pill");if(!p)return;
  const sec=$(p.dataset.cat);if(!sec)return;
  spyLock=Date.now()+1500;lastSpy=p.dataset.cat;setActive(p.dataset.cat);
  sec.scrollIntoView({behavior:"smooth",block:"start"});
});
let ticking=false;
window.addEventListener("scroll",()=>{if(ticking)return;ticking=true;requestAnimationFrame(()=>{ticking=false;spy()})},{passive:true});
window.addEventListener("resize",measure);

if(!window.TRAGOS||!window.TRAGOS.categorias){
  $("hora").style.display="none";paintTheme();
  $("menu").innerHTML='<div class="item" style="margin-top:16px"><div class="body"><div class="name">⚠️ No se encontró tragos-data.js</div><div class="desc">Sube <b>tragos-data.js</b> a la misma carpeta que <b>tragos.html</b> (en GitHub, al mismo nivel que index.html).</div></div></div>';
}else{ render(); }
